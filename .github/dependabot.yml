version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Undici 8 requires Node >=22.19; this package supports >=22.12.
      - dependency-name: "undici"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/chatgpt-plugin"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Agents requires the exact @modelcontextprotocol/server 2.3.1 peer.
      # Revisit when the published Agents peer requirement changes.
      - dependency-name: "@modelcontextprotocol/server"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
