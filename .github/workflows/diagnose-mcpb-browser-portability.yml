name: Diagnose MCPB browser portability

on:
  push:
    branches:
      - chore/web-validator-mcpb-portable-browser

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies without browser download
        env:
          PUPPETEER_SKIP_DOWNLOAD: 'true'
        run: npm ci
      - name: Download supported headless-shell targets into a package-local cache
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { Browser, BrowserPlatform, computeExecutablePath, install } from '@puppeteer/browsers';
          import { PUPPETEER_REVISIONS } from 'puppeteer-core/internal/revisions.js';

          const cacheDir = path.resolve('.mcpb-browser-cache');
          const buildId = PUPPETEER_REVISIONS['chrome-headless-shell'];
          const targets = [
            BrowserPlatform.LINUX,
            BrowserPlatform.MAC,
            BrowserPlatform.MAC_ARM,
            BrowserPlatform.WIN64,
          ];
          console.log(JSON.stringify({ buildId, cacheDir, targets }, null, 2));
          for (const platform of targets) {
            await install({
              browser: Browser.CHROMEHEADLESSSHELL,
              buildId,
              platform,
              cacheDir,
            });
            const executable = computeExecutablePath({
              browser: Browser.CHROMEHEADLESSSHELL,
              buildId,
              platform,
              cacheDir,
            });
            if (!fs.existsSync(executable)) {
              throw new Error(`Missing executable for ${platform}: ${executable}`);
            }
            console.log(`${platform}: ${executable}`);
          }
          EOF
      - name: Measure browser payload
        run: |
          du -sh .mcpb-browser-cache
          du -sh .mcpb-browser-cache/*/* | sort -h
          zip -qr browser-cache.zip .mcpb-browser-cache
          ls -lh browser-cache.zip
      - name: Smoke launch Linux headless shell from package-local cache
        env:
          PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.mcpb-browser-cache
        run: |
          node --input-type=module <<'EOF'
          import puppeteer from 'puppeteer';
          const browser = await puppeteer.launch({ headless: 'shell' });
          const page = await browser.newPage();
          await page.setContent('<!doctype html><title>portable</title><h1>ok</h1>');
          console.log(await page.title());
          await browser.close();
          EOF
