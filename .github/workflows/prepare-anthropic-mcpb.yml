name: Prepare Anthropic MCPB metadata

on:
  push:
    branches:
      - chore/anthropic-mcpb-directory

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/anthropic-mcpb-directory
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          cache: npm

      - name: Apply MCPB directory metadata
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const manifestPath = 'manifest.json';
          const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
          manifest.manifest_version = '0.3';
          manifest.privacy_policies = [
            'https://digestseo.com/privacy/',
            'https://www.w3.org/policies/privacy/'
          ];
          fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');

          const readmePath = 'README.md';
          let readme = fs.readFileSync(readmePath, 'utf8');
          if (readme.includes('## Privacy and safe use')) {
            readme = readme.replace('## Privacy and safe use', '## Privacy Policy');
          } else if (!readme.includes('## Privacy Policy')) {
            throw new Error('Missing expected README privacy heading');
          }
          fs.writeFileSync(readmePath, readme);
          NODE

      - name: Synchronize generated manifests
        run: |
          npm ci
          npm run build
          npm run sync:manifests

      - name: Capture verification diagnostics
        shell: bash
        run: |
          set +e
          npm run check > verification.txt 2>&1
          CHECK_STATUS=$?
          npx -y @anthropic-ai/mcpb@2.1.2 validate manifest.json >> verification.txt 2>&1
          MCPB_STATUS=$?
          set -e
          cat verification.txt
          if [ "$CHECK_STATUS" -ne 0 ] || [ "$MCPB_STATUS" -ne 0 ]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add verification.txt
            git commit -m "chore: capture Web Validator MCPB diagnostics"
            git push origin HEAD:chore/anthropic-mcpb-directory
            exit 1
          fi

      - name: Commit verified metadata
        run: |
          rm -f verification.txt mcpb-validation.txt
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add manifest.json server.json README.md
          git add -u mcpb-validation.txt verification.txt || true
          git commit -m "chore: align Anthropic MCPB directory metadata"
          git push origin HEAD:chore/anthropic-mcpb-directory
