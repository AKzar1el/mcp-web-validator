name: Publish npm package

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish tagged npm release
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.18.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing
        run: npm install --global npm@^11.15.0

      - name: Verify tag matches package version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          package_version="$(node -p "require('./package.json').version")"
          test "$tag_version" = "$package_version"

      - name: Install locked dependencies
        run: npm ci

      # Keep release qualification in parity with the local-server CI job.
      # Browser-dependent MCP contracts must pass before npm publication.
      - name: Build screenshot runtime
        run: npm run build

      - name: Install pinned screenshot browser
        run: node --input-type=module -e "import { resolveScreenshotBrowserExecutable } from './dist/screenshot.js'; console.log(await resolveScreenshotBrowserExecutable())"

      - name: Allow only the pinned browser binary to create sandbox user namespaces
        shell: bash
        run: |
          set -euo pipefail
          binary="$(node --input-type=module -e "import { resolveScreenshotBrowserExecutable } from './dist/screenshot.js'; process.stdout.write(await resolveScreenshotBrowserExecutable())")"
          case "$binary" in
            "$HOME"/.cache/puppeteer/chrome-headless-shell/linux-*/chrome-headless-shell-linux64/chrome-headless-shell) ;;
            *) echo "Unexpected browser executable path; refusing AppArmor exception" >&2; exit 1 ;;
          esac
          test -x "$binary"
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"
          sudo tee /etc/apparmor.d/mcp-web-validator-publish-shell >/dev/null <<EOF
          abi <abi/4.0>,
          include <tunables/global>
          profile mcp-web-validator-publish-shell "$binary" flags=(unconfined) {
            userns,
          }
          EOF
          sudo apparmor_parser -r /etc/apparmor.d/mcp-web-validator-publish-shell
          test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "1"

      - name: Run package qualification
        run: npm run check

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Inspect package contents
        run: npm pack --dry-run

      - name: Publish with npm trusted publishing
        run: npm publish --provenance --access public
