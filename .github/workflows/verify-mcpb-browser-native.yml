name: Verify MCPB browser natively

on:
  push:
    branches:
      - chore/web-validator-mcpb-portable-browser

permissions:
  contents: read

jobs:
  native-browser:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    env:
      PUPPETEER_SKIP_DOWNLOAD: 'true'
      PUPPETEER_CACHE_DIR: ${{ github.workspace }}/.mcpb-browser-cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - name: Install dependencies without a user-level browser cache
        run: npm ci
      - name: Install pinned Headless Shell into the package-local cache
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import { Browser, computeExecutablePath, detectBrowserPlatform, install } from '@puppeteer/browsers';
          import { PUPPETEER_REVISIONS } from 'puppeteer-core/internal/revisions.js';

          const platform = detectBrowserPlatform();
          if (!platform) throw new Error(`Unsupported runner platform: ${process.platform}/${process.arch}`);
          const cacheDir = path.resolve('.mcpb-browser-cache');
          const buildId = PUPPETEER_REVISIONS['chrome-headless-shell'];
          await install({ browser: Browser.CHROMEHEADLESSSHELL, buildId, platform, cacheDir });
          const executable = computeExecutablePath({ browser: Browser.CHROMEHEADLESSSHELL, buildId, platform, cacheDir });
          if (!fs.existsSync(executable)) throw new Error(`Headless Shell missing: ${executable}`);
          console.log(JSON.stringify({ processPlatform: process.platform, processArch: process.arch, platform, buildId, executable }, null, 2));
          EOF
      - name: Launch packaged browser mode and capture a real PNG
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import fs from 'node:fs';
          import path from 'node:path';
          import puppeteer from 'puppeteer';

          const browser = await puppeteer.launch({ headless: 'shell' });
          try {
            const page = await browser.newPage();
            await page.setViewport({ width: 800, height: 600 });
            await page.setContent('<!doctype html><meta charset="utf-8"><title>MCPB portable browser</title><h1>Web Validator</h1>');
            const output = path.resolve('mcpb-browser-native-smoke.png');
            await page.screenshot({ path: output });
            const size = fs.statSync(output).size;
            if (size < 100) throw new Error(`Screenshot is unexpectedly small: ${size}`);
            console.log(`Captured ${output} (${size} bytes)`);
          } finally {
            await browser.close();
          }
          EOF
